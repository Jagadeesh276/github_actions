---
name: python code run
on:
  push:
    branches:
      - main
jobs:
  run-python:
    runs-on: ubuntu-latest
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: run python file
        run: python testing.py
